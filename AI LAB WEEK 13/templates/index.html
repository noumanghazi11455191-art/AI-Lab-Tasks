<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="animate-fade-in">
            <h1>Health <span class="accent">Predictor</span></h1>
            <p>Select your symptoms for an AI-powered preliminary analysis.</p>
        </header>

        <section class="search-section">
            <input type="text" id="symptomSearch" placeholder="Search symptoms (e.g. itching, fever)..." onkeyup="filterSymptoms()">
        </section>

        <form action="/predict" method="POST" class="prediction-form">
            <div class="symptom-grid" id="symptomGrid">
                {% for symptom in symptoms %}
                <div class="symptom-item">
                    <input type="checkbox" name="symptoms" value="{{ symptom }}" id="{{ symptom }}">
                    <label for="{{ symptom }}">{{ symptom.replace('_', ' ') }}</label>
                </div>
                {% endfor %}
            </div>
            
            <div class="button-container">
                <button type="submit" class="btn-predict">Analyze Health Status</button>
            </div>
        </form>
    </div>

    <script>
        function filterSymptoms() {
            let input = document.getElementById('symptomSearch').value.toLowerCase();
            let items = document.getElementsByClassName('symptom-item');
            
            for (let i = 0; i < items.length; i++) {
                let label = items[i].getElementsByTagName('label')[0];
                if (label.innerHTML.toLowerCase().includes(input)) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
